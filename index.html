<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=yes">
    <title>GAS Tool</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            color: #e0e0e0;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Main Tabs - শুধু ট্যাব বাটন, কোনো হেডার নেই, এক লাইনে ছোট আকারে */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            flex-wrap: nowrap;
            justify-content: space-between;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 8px;
            font-size: 0.85rem;
            font-weight: 600;
            border: none;
            background: transparent;
            color: #a0a0a0;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.3s ease;
            font-family: inherit;
            white-space: nowrap;
            text-align: center;
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .tab-content.active {
            display: block;
        }

        /* Sub Tabs (Insta Tools এর ভিতরে) */
        .sub-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px;
            border-radius: 14px;
        }

        .sub-tab-btn {
            flex: 1;
            padding: 10px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            border: none;
            background: transparent;
            color: #c4b5fd;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s ease;
            font-family: inherit;
            text-align: center;
        }

        .sub-tab-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #e9d5ff;
        }

        .sub-tab-btn.active {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: white;
        }

        .sub-tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .sub-tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid rgba(102, 126, 234, 0.5);
            display: inline-block;
        }

        textarea, input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #e0e0e0;
            font-size: 0.95rem;
            font-family: 'Courier New', monospace;
            resize: vertical;
            transition: all 0.3s ease;
        }

        textarea:focus, input:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(0, 0, 0, 0.5);
        }

        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-danger {
            background: linear-gradient(135deg, #e53e3e, #c53030);
        }

        .btn-download {
            background: linear-gradient(135deg, #38a169, #2f855a);
            margin-top: 12px;
            width: 100%;
        }

        .btn-clear {
            background: linear-gradient(135deg, #d69e2e, #b7791f);
            margin-top: 12px;
            width: 100%;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #4a5568, #2d3748);
        }

        .range-buttons-group {
            margin: 16px 0 12px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .range-btn {
            background: rgba(72, 187, 120, 0.2);
            border: 1px solid rgba(72, 187, 120, 0.5);
            color: #9ae6b4;
            font-family: monospace;
            font-size: 0.85rem;
            padding: 8px 16px;
            border-radius: 40px;
            transition: all 0.2s ease;
        }

        .range-btn:hover {
            background: #48bb78;
            color: white;
            transform: translateY(-1px);
            border-color: #48bb78;
        }

        .response-box {
            margin-top: 20px;
            padding: 16px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            border-left: 4px solid #667eea;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 300px;
            overflow-y: auto;
        }

        .response-box.error {
            border-left-color: #e53e3e;
            background: rgba(229, 62, 62, 0.1);
        }

        .response-box.success {
            border-left-color: #48bb78;
        }

        .response-box.warning {
            border-left-color: #d69e2e;
            background: rgba(214, 158, 46, 0.1);
        }

        .otp-section {
            background: linear-gradient(135deg, rgba(72, 187, 120, 0.2), rgba(56, 161, 105, 0.1));
            border: 1px solid rgba(72, 187, 120, 0.3);
            border-radius: 12px;
            padding: 16px;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .otp-code {
            font-size: 2rem;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            letter-spacing: 4px;
            color: #48bb78;
        }

        .copy-btn {
            padding: 8px 20px;
            background: #48bb78;
        }

        .copy-btn.copied, .copy-all-btn.copied {
            background: #38a169;
            transform: scale(0.98);
        }

        .data-list {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 16px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
        }

        .data-item {
            padding: 8px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .row-count {
            font-size: 0.8rem;
            color: #a0a0a0;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
        }

        .link-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: rgba(128, 90, 213, 0.3);
            border: 1px solid rgba(128, 90, 213, 0.5);
            border-radius: 10px;
            color: #b794f4;
            text-decoration: none;
            font-size: 0.85rem;
        }

        .link-btn:hover {
            background: rgba(128, 90, 213, 0.5);
            color: white;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #2d3748;
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 0.9rem;
            z-index: 1000;
            animation: fadeInUp 0.3s ease;
            pointer-events: none;
            font-weight: 500;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* Insta Tools specific */
        .insta-card {
            background: rgba(30, 30, 69, 0.6);
            border-radius: 20px;
            padding: 20px;
        }
        
        .big-submit-btn {
            width: 100%;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: 700;
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            margin-bottom: 18px;
        }
        
        .hidden {
            display: none;
        }
        
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .tool-card {
            background: rgba(30, 30, 69, 0.6);
            border-radius: 20px;
            padding: 1.2rem;
            border: 1px solid #4c1d95;
        }
        
        .tool-card h3 {
            font-size: 1rem;
            margin-bottom: 1rem;
            color: #c4b5fd;
            border-left: 3px solid #8b5cf6;
            padding-left: 12px;
        }
        
        .side-by-side {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .side-by-side input {
            flex: 2;
            min-width: 120px;
        }
        
        .side-by-side button {
            flex: 1;
            min-width: 100px;
            padding: 10px 16px;
        }
        
        .three-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        
        .three-buttons button {
            flex: 1;
            min-width: 140px;
        }
        
        .username-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 12px 0;
            max-height: 250px;
            overflow-y: auto;
        }
        
        .username-btn {
            background: linear-gradient(135deg, #4c1d95, #6d28d9);
            border: none;
            border-radius: 40px;
            padding: 8px 16px;
            font-size: 0.85rem;
            font-weight: 500;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .username-btn:hover {
            background: linear-gradient(135deg, #6d28d9, #7c3aed);
            transform: scale(0.98);
        }
        
        .username-btn .number {
            background: rgba(255,255,255,0.2);
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.8rem;
        }
        
        .summary-text {
            background: #0f0f2d;
            padding: 10px;
            border-radius: 16px;
            font-family: monospace;
            font-size: 0.8rem;
            white-space: pre-wrap;
            color: #c4b5fd;
        }
        
        button .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid #ffffff80;
            border-top: 2px solid white;
            border-radius: 50%;
            display: inline-block;
            animation: spin 0.6s linear infinite;
        }

        @media (max-width: 650px) {
            .tabs { flex-wrap: wrap; }
            .tab-btn { flex: auto; min-width: calc(50% - 8px); }
            .tools-grid { grid-template-columns: 1fr; }
            .side-by-side { flex-direction: column; }
            .side-by-side input, .side-by-side button { width: 100%; }
            .three-buttons { flex-direction: column; }
            .three-buttons button { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- শুধু ৪টি ট্যাব বাটন - কোনো হেডার/টাইটেল নেই -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="transfer">📤 Data Transfer</button>
            <button class="tab-btn" data-tab="acolumn">📊 A Column Data</button>
            <button class="tab-btn" data-tab="delete">🗑️ Row Delete</button>
            <button class="tab-btn" data-tab="instatools">📷 Insta Tools</button>
        </div>

        <!-- Tab 1: Data Transfer -->
        <div id="transfer" class="tab-content active">
            <div class="card">
                <h2 class="card-title">📤 Data Transfer Mode</h2>
                <button id="submitTransfer" style="width:100%;margin-bottom:16px;">Submit Data</button>
                <textarea id="transferInput" rows="8" placeholder="Paste your data here...&#10;Example:&#10;https://www.facebook.com/profile.php?id=12345678901234&#10;ABCD EFGH IJKL MNOP QRST UVWX YZ12 3456&#10;user@example.com"></textarea>
                
                <div class="range-buttons-group" id="rangeButtonsContainer">
                    <span style="font-size:0.8rem; opacity:0.7;">📋 Quick Range Copy:</span>
                </div>
                
                <div id="transferResponse"></div>
            </div>
        </div>

        <!-- Tab 2: A Column Data -->
        <div id="acolumn" class="tab-content">
            <div class="card">
                <h2 class="card-title">📊 A Column Data</h2>
                <div class="action-bar">
                    <span class="row-count" id="rowCount">0 rows</span>
                    <div style="display:flex;gap:8px;">
                        <a href="https://check.fb.tools" target="_blank" class="link-btn">🔗 Open 2FA Checker</a>
                        <button id="copyAllData" class="btn-secondary copy-all-btn" style="padding:8px 16px;">📋 Copy All</button>
                        <button id="refreshData" class="btn-secondary" style="padding:8px 16px;">🔄 Refresh</button>
                    </div>
                </div>
                <div id="dataList" class="data-list"><div style="text-align:center;padding:40px;color:#666;">Loading data...</div></div>
            </div>
        </div>

        <!-- Tab 3: Row Delete -->
        <div id="delete" class="tab-content">
            <div class="card">
                <h2 class="card-title">🗑️ Row Delete</h2>
                <div style="margin-bottom:12px;font-size:0.85rem;color:#a0a0a0;">💡 Enter one value per line to delete rows.</div>
                <textarea id="deleteInput" rows="6" placeholder="826282737&#10;383738383"></textarea>
                <button id="submitDelete" class="btn-danger" style="width:100%;">🗑️ Delete Row(s)</button>
                <button id="sheetDownloadBtn" class="btn-download" style="margin-top:12px;width:100%;">📥 Sheet Download (A, C, D → A, B, C)</button>
                <button id="clearSheetBtn" class="btn-clear" style="margin-top:12px;width:100%;">⚠️ Clear Sheet (Delete All Data)</button>
                <div id="deleteResponse"></div>
            </div>
        </div>

        <!-- Tab 4: Insta Tools (with 2 sub-tabs) -->
        <div id="instatools" class="tab-content">
            <div class="card">
                <h2 class="card-title">📷 Insta Tools</h2>
                
                <!-- Sub Tabs -->
                <div class="sub-tabs">
                    <button class="sub-tab-btn active" data-subtab="dataSubmit">📋 Data Submit</button>
                    <button class="sub-tab-btn" data-subtab="anotherTools">⚙️ Another Tools</button>
                </div>

                <!-- Sub Tab 1: Data Submit (default active) -->
                <div id="dataSubmit" class="sub-tab-content active">
                    <div class="insta-card">
                        <button id="submitDataBtn" class="big-submit-btn">📝 Insta Data Submit</button>
                        <textarea id="instaDataInput" rows="5" placeholder="Enter Insta Data&#10;Example: abc123 or any text"></textarea>
                        <div class="otp-copy-wrapper hidden" id="otpCopyWrapper" style="margin-top:15px;">
                            <button id="copyOtpBtn" class="btn-secondary" style="width:100%;">📋 Copy OTP</button>
                        </div>
                        <div id="instaResponseArea" style="margin-top:15px;"></div>
                    </div>
                </div>

                <!-- Sub Tab 2: Another Tools -->
                <div id="anotherTools" class="sub-tab-content">
                    <div class="tools-grid">
                        <div class="tool-card">
                            <h3>🔄 Value Change</h3>
                            <div class="side-by-side">
                                <input type="text" id="oldUsername" placeholder="Old Username">
                                <input type="text" id="newUsername" placeholder="New Username">
                                <button id="valueChangeBtn">Value Change</button>
                            </div>
                        </div>
                        <div class="tool-card">
                            <h3>🗑️ Row Delete</h3>
                            <div class="side-by-side">
                                <input type="text" id="rowDeleteInput" placeholder="Enter Row / Username">
                                <button id="rowDeleteBtn">Delete Row</button>
                            </div>
                        </div>
                    </div>
                    <div id="acColumnResult" style="margin-top: 1rem;"></div>
                    <div class="three-buttons">
                        <button id="acColumnBtn">📥 AC Column</button>
                        <button id="abcDownloadBtn">📑 Insta Data ABC Download</button>
                        <button id="clearSheetInstaBtn" style="background:#b91c1c;">🧹 ClearSheet</button>
                    </div>
                    <div id="instaAnotherResponse" style="margin-top:15px;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==================== ORIGINAL FIRST SCRIPT ====================
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzGwD-90pi_jhToDjRKS_visRYoRdGS3H4qcf-DRpo3xZAIbfUNuF55XY3xTtKPzZr_0Q/exec";
        
        const RANGE_VALUES = ["225016XXXXXXX", "23276XXXXXX", "237621XXXXXX", "23278XXXXXX", "40771XXXXXX"];
        const FIXED_PREFIX = "01572398949";

        function showToast(message, isError = false) {
            const existingToast = document.querySelector('.toast');
            if (existingToast) existingToast.remove();
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.style.background = isError ? '#e53e3e' : '#2d3748';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => { if (toast && toast.parentNode) toast.remove(); }, 2800);
        }

        async function copyToClipboard(text, buttonElement = null) {
            if (!text || text.length === 0) { showToast('❌ Nothing to copy', true); return false; }
            if (navigator.clipboard && window.isSecureContext) {
                try {
                    await navigator.clipboard.writeText(text);
                    if (buttonElement) {
                        const originalText = buttonElement.textContent;
                        buttonElement.textContent = '✓ Copied!';
                        buttonElement.classList.add('copied');
                        setTimeout(() => {
                            buttonElement.textContent = originalText;
                            buttonElement.classList.remove('copied');
                        }, 1500);
                    }
                    showToast(`✅ Copied: ${text.length > 30 ? text.substring(0, 30) + '...' : text}`, false);
                    return true;
                } catch (err) { console.warn(err); }
            }
            try {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.left = '-9999px';
                document.body.appendChild(textarea);
                textarea.select();
                const success = document.execCommand('copy');
                document.body.removeChild(textarea);
                if (success) {
                    if (buttonElement) {
                        const originalText = buttonElement.textContent;
                        buttonElement.textContent = '✓ Copied!';
                        buttonElement.classList.add('copied');
                        setTimeout(() => {
                            buttonElement.textContent = originalText;
                            buttonElement.classList.remove('copied');
                        }, 1500);
                    }
                    showToast(`✅ Copied to clipboard`, false);
                    return true;
                }
                throw new Error('execCommand false');
            } catch (err) {
                showToast('❌ Copy failed. Please copy manually.', true);
                return false;
            }
        }

        // Main Tab Switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const tabId = btn.getAttribute('data-tab');
                document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(tabId).classList.add('active');
                if (tabId === 'acolumn') loadAColumnData();
            });
        });

        async function callGAS(params) {
            const url = new URL(GAS_URL);
            Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v));
            const res = await fetch(url.toString(), { method: 'GET', mode: 'cors' });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return await res.text();
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        let clearTimer = null;
        function scheduleAutoClear(responseDiv) {
            if (clearTimer) clearTimeout(clearTimer);
            clearTimer = setTimeout(() => {
                if (responseDiv) responseDiv.innerHTML = '';
                clearTimer = null;
                showToast('✨ Ready for next input', false);
            }, 6000);
        }

        const transferInput = document.getElementById('transferInput');
        const submitTransferBtn = document.getElementById('submitTransfer');
        const transferResponseDiv = document.getElementById('transferResponse');
        const rangeContainer = document.getElementById('rangeButtonsContainer');

        function buildRangeButtons() {
            if (!rangeContainer) return;
            const existingBtns = rangeContainer.querySelectorAll('.range-btn');
            existingBtns.forEach(btn => btn.remove());
            RANGE_VALUES.forEach(value => {
                const btn = document.createElement('button');
                btn.textContent = value;
                btn.className = 'range-btn';
                btn.type = 'button';
                btn.addEventListener('click', async (e) => {
                    e.preventDefault();
                    await copyToClipboard(value, btn);
                });
                rangeContainer.appendChild(btn);
            });
        }
        buildRangeButtons();

        function buildFinalPayload(rawUserInput) {
            let trimmed = rawUserInput.trim();
            if (!trimmed) return "";
            return trimmed + FIXED_PREFIX + "*";
        }

        async function submitTransfer() {
            let rawInput = transferInput.value.trim();
            if (!rawInput) {
                transferResponseDiv.innerHTML = `<div class="response-box error">❌ Please enter data.</div>`;
                showToast('❌ Please enter data first', true);
                scheduleAutoClear(transferResponseDiv);
                return;
            }
            const finalPayload = buildFinalPayload(rawInput);
            submitTransferBtn.disabled = true;
            submitTransferBtn.innerHTML = '<span class="loading"></span> Sending...';
            transferResponseDiv.innerHTML = '<div class="response-box">⏳ Processing...</div>';
            try {
                const result = await callGAS({ transfer: finalPayload });
                const otpMatch = result.match(/🔢 OTP:\s*(\d{6})/);
                const otp = otpMatch ? otpMatch[1] : null;
                let otpHtml = '';
                if (otp) {
                    const uniqueId = 'copyOtpBtn_' + Date.now();
                    otpHtml = `<div class="otp-section" id="otpSection_${uniqueId}">
                        <span>🔢 OTP:</span>
                        <span class="otp-code" id="otpCode_${uniqueId}">${otp}</span>
                        <button class="copy-btn" id="${uniqueId}">📋 Copy OTP</button>
                    </div>`;
                    transferResponseDiv.innerHTML = otpHtml + `<div class="response-box success">${escapeHtml(result)}</div>`;
                    const otpCopyBtn = document.getElementById(uniqueId);
                    if (otpCopyBtn) {
                        otpCopyBtn.addEventListener('click', async (e) => {
                            e.preventDefault();
                            const otpCodeSpan = document.getElementById(`otpCode_${uniqueId}`);
                            const otpCode = otpCodeSpan ? otpCodeSpan.innerText : otp;
                            await copyToClipboard(otpCode, otpCopyBtn);
                        });
                    }
                } else {
                    transferResponseDiv.innerHTML = `<div class="response-box success">${escapeHtml(result)}</div>`;
                }
                transferInput.value = '';
                showToast('✅ Data submitted successfully!', false);
                scheduleAutoClear(transferResponseDiv);
            } catch (err) {
                transferResponseDiv.innerHTML = `<div class="response-box error">❌ Error: ${escapeHtml(err.message)}</div>`;
                showToast('❌ Submission failed: ' + err.message, true);
                scheduleAutoClear(transferResponseDiv);
            } finally {
                submitTransferBtn.disabled = false;
                submitTransferBtn.innerHTML = 'Submit Data';
            }
        }
        submitTransferBtn.addEventListener('click', submitTransfer);

        let currentData = [];
        async function loadAColumnData() {
            const dataListDiv = document.getElementById('dataList');
            const rowCountSpan = document.getElementById('rowCount');
            const copyBtn = document.getElementById('copyAllData');
            dataListDiv.innerHTML = '<div style="text-align:center;padding:40px;"><span class="loading"></span> Loading...</div>';
            if(copyBtn) copyBtn.disabled = true;
            try {
                const result = await callGAS({ acolumn: "data" });
                let parsed;
                try { 
                    parsed = JSON.parse(result); 
                    if (!Array.isArray(parsed)) parsed = [result]; 
                }
                catch { 
                    parsed = result.split('\n').filter(l => l.trim()); 
                }
                currentData = parsed.filter(i => i && i.toString().trim());
                if (!currentData.length) {
                    dataListDiv.innerHTML = '<div style="text-align:center;padding:40px;">📭 No data found</div>';
                    rowCountSpan.textContent = '0 rows';
                    if(copyBtn) copyBtn.disabled = true;
                } else {
                    dataListDiv.innerHTML = currentData.map(i => `<div class="data-item">${escapeHtml(i.toString())}</div>`).join('');
                    rowCountSpan.textContent = `${currentData.length} rows`;
                    if(copyBtn) copyBtn.disabled = false;
                }
            } catch(err) {
                dataListDiv.innerHTML = `<div style="padding:40px;color:#e53e3e;">❌ ${escapeHtml(err.message)}</div>`;
                rowCountSpan.textContent = '0 rows';
                if(copyBtn) copyBtn.disabled = true;
                showToast('Failed to load data', true);
            }
        }
        
        const copyAllBtn = document.getElementById('copyAllData');
        if (copyAllBtn) {
            const newCopyAllBtn = copyAllBtn.cloneNode(true);
            copyAllBtn.parentNode.replaceChild(newCopyAllBtn, copyAllBtn);
            newCopyAllBtn.addEventListener('click', async (e) => {
                e.preventDefault();
                if (currentData.length === 0) { showToast('❌ No data to copy', true); return; }
                await copyToClipboard(currentData.join('\n'), newCopyAllBtn);
            });
        }
        
        const refreshBtn = document.getElementById('refreshData');
        if (refreshBtn) refreshBtn.addEventListener('click', () => { loadAColumnData(); showToast('🔄 Refreshing data...', false); });

        const deleteInput = document.getElementById('deleteInput');
        const submitDeleteBtn = document.getElementById('submitDelete');
        const deleteResponseDiv = document.getElementById('deleteResponse');

        async function submitDelete() {
            const input = deleteInput.value.trim();
            if (!input) {
                deleteResponseDiv.innerHTML = `<div class="response-box error">❌ Enter values to delete.</div>`;
                showToast('❌ Please enter values to delete', true);
                return;
            }
            const lines = input.split('\n').map(l=>l.trim()).filter(l=>l);
            if(!lines.length) return;
            submitDeleteBtn.disabled = true;
            submitDeleteBtn.innerHTML = '<span class="loading"></span> Deleting...';
            deleteResponseDiv.innerHTML = '<div class="response-box">⏳ Deleting...</div>';
            try {
                const result = await callGAS({ deletevalues: lines.join(',') });
                const success = result.includes('✅') || result.includes('deleted') || result.includes('success');
                deleteResponseDiv.innerHTML = `<div class="response-box ${success ? 'success' : 'error'}">${escapeHtml(result)}</div>`;
                if(success) {
                    deleteInput.value = '';
                    showToast(`✅ ${lines.length} row(s) deleted successfully!`, false);
                    if(document.getElementById('acolumn').classList.contains('active')) loadAColumnData();
                } else showToast(`⚠️ Deletion completed with warnings`, false);
            } catch(err) {
                deleteResponseDiv.innerHTML = `<div class="response-box error">❌ ${escapeHtml(err.message)}</div>`;
                showToast('❌ Delete failed: ' + err.message, true);
            } finally {
                submitDeleteBtn.disabled = false;
                submitDeleteBtn.innerHTML = '🗑️ Delete Row(s)';
            }
        }
        if (submitDeleteBtn) {
            const newDeleteBtn = submitDeleteBtn.cloneNode(true);
            submitDeleteBtn.parentNode.replaceChild(newDeleteBtn, submitDeleteBtn);
            newDeleteBtn.addEventListener('click', submitDelete);
        }

        const clearSheetBtn = document.getElementById('clearSheetBtn');
        async function clearSheet() {
            if (!clearSheetBtn) return;
            const confirmed = confirm("⚠️ WARNING: This will delete ALL data from the sheet!");
            if (!confirmed) { showToast('❌ Clear sheet cancelled', false); return; }
            clearSheetBtn.disabled = true;
            const originalText = clearSheetBtn.innerHTML;
            clearSheetBtn.innerHTML = '<span class="loading"></span> Clearing sheet...';
            if (deleteResponseDiv) deleteResponseDiv.innerHTML = '<div class="response-box">⏳ Sending clear request...</div>';
            try {
                const result = await callGAS({ clearallsheet: "true" });
                let isSuccess = result.includes('✅') || result.includes('success') || result.includes('cleared');
                if (deleteResponseDiv) deleteResponseDiv.innerHTML = `<div class="response-box ${isSuccess ? 'success' : 'warning'}">${escapeHtml(result)}</div>`;
                showToast(isSuccess ? '✅ Sheet cleared successfully!' : '⚠️ Sheet clear completed with warnings', false);
                if (document.getElementById('acolumn').classList.contains('active')) setTimeout(() => loadAColumnData(), 1000);
            } catch(err) {
                if (deleteResponseDiv) deleteResponseDiv.innerHTML = `<div class="response-box error">❌ Failed: ${escapeHtml(err.message)}</div>`;
                showToast('❌ Failed to clear sheet: ' + err.message, true);
            } finally {
                clearSheetBtn.disabled = false;
                clearSheetBtn.innerHTML = originalText;
            }
        }
        if (clearSheetBtn) clearSheetBtn.addEventListener('click', clearSheet);

        const sheetDownloadBtn = document.getElementById('sheetDownloadBtn');
        async function downloadSheetOnlyData() {
            if(!sheetDownloadBtn) return;
            sheetDownloadBtn.disabled = true;
            const originalText = sheetDownloadBtn.innerHTML;
            sheetDownloadBtn.innerHTML = '<span class="loading"></span> Fetching data...';
            try {
                const responseText = await callGAS({ acd: "column" });
                let jsonData;
                try { jsonData = JSON.parse(responseText); } catch(e) { throw new Error('Invalid JSON from server.'); }
                const colA = jsonData.A || jsonData.a || [];
                const colC = jsonData.B || jsonData.b || [];
                const colD = jsonData.C || jsonData.c || [];
                const fileName = jsonData.fileName || `data_export_${Date.now()}.xlsx`;
                if(!Array.isArray(colA) || !Array.isArray(colC) || !Array.isArray(colD)) throw new Error('JSON must have A, B, C arrays');
                const maxLen = Math.max(colA.length, colC.length, colD.length);
                if(maxLen === 0) { showToast('⚠️ No data found', true); return; }
                const worksheetData = [];
                for(let i = 0; i < maxLen; i++) {
                    worksheetData.push([
                        (i < colA.length && colA[i] != null) ? colA[i] : "",
                        (i < colC.length && colC[i] != null) ? colC[i] : "",
                        (i < colD.length && colD[i] != null) ? colD[i] : ""
                    ]);
                }
                const ws = XLSX.utils.aoa_to_sheet(worksheetData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Sheet1");
                XLSX.writeFile(wb, fileName);
                showToast(`✅ Downloaded ${maxLen} rows`);
                if(deleteResponseDiv) deleteResponseDiv.innerHTML = `<div class="response-box success">✅ Downloaded ${maxLen} rows</div>`;
                setTimeout(() => { if(deleteResponseDiv && deleteResponseDiv.innerHTML.includes("Downloaded")) deleteResponseDiv.innerHTML = ''; }, 4000);
            } catch(err) {
                showToast(`❌ Download failed: ${err.message}`, true);
                if(deleteResponseDiv) deleteResponseDiv.innerHTML = `<div class="response-box error">❌ ${escapeHtml(err.message)}</div>`;
            } finally {
                sheetDownloadBtn.disabled = false;
                sheetDownloadBtn.innerHTML = originalText;
            }
        }
        if (sheetDownloadBtn) sheetDownloadBtn.addEventListener('click', downloadSheetOnlyData);

        loadAColumnData();
        if (deleteInput) deleteInput.addEventListener('keydown', (e) => { if((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); submitDelete(); } });
        if (transferInput) transferInput.addEventListener('keydown', (e) => { if((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); submitTransfer(); } });
        if (transferInput) transferInput.addEventListener('dblclick', () => { if (!transferInput.value) transferInput.value = `https://www.facebook.com/profile.php?id=12345678901234\nABCD EFGH IJKL MNOP QRST UVWX YZ12 3456\nuser@example.com`; });

        // ==================== SECOND SCRIPT (Insta Tools) ====================
        const INSTA_GAS_URL = "https://script.google.com/macros/s/AKfycbyhlsZ3oqZK9sb2oP6VcKJJ5pRZQL45e47ozqxsXd8dWHezHrc08GZvsCvVzts_Hdia/exec";
        
        const instaResponseArea = document.getElementById('instaResponseArea');
        const instaAnotherResponse = document.getElementById('instaAnotherResponse');
        
        function showInstaResponse(message, type, isAnother = false) {
            const container = isAnother ? instaAnotherResponse : instaResponseArea;
            if (!container) return;
            const html = `<div class="response-box ${type}" style="margin-top:8px;">${escapeHtml(message)}</div>`;
            container.innerHTML = html;
            setTimeout(() => { if (container.innerHTML === html) container.innerHTML = ''; }, 20000);
        }

        async function instaApiRequest(url, buttonElement = null, errorMsg = "Request failed", isAnother = false) {
            if (buttonElement) {
                buttonElement.disabled = true;
                const originalText = buttonElement.innerHTML;
                buttonElement.innerHTML = `<span class="spinner"></span> Please wait...`;
                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const text = await response.text();
                    return text;
                } catch (err) {
                    showInstaResponse(`⚠️ ${errorMsg}. Network error.`, 'error', isAnother);
                    return null;
                } finally {
                    buttonElement.disabled = false;
                    buttonElement.innerHTML = originalText;
                }
            }
            return null;
        }

        function extractOtp(text) {
            const match = text.match(/\b\d{6}\b/);
            return match ? match[0] : null;
        }

        let currentInstaOtp = null;
        const copyOtpBtnInsta = document.getElementById('copyOtpBtn');
        const otpWrapperInsta = document.getElementById('otpCopyWrapper');
        function setOtpButtonVisibility(otp) {
            if (otp && otpWrapperInsta) {
                currentInstaOtp = otp;
                otpWrapperInsta.classList.remove('hidden');
            } else if (otpWrapperInsta) {
                currentInstaOtp = null;
                otpWrapperInsta.classList.add('hidden');
            }
        }
        if (copyOtpBtnInsta) {
            copyOtpBtnInsta.addEventListener('click', async () => {
                if (!currentInstaOtp) { showToast("❌ No OTP found", true); return; }
                await copyToClipboard(currentInstaOtp, copyOtpBtnInsta);
            });
        }
        setOtpButtonVisibility(null);

        const submitDataBtn = document.getElementById('submitDataBtn');
        const instaDataInput = document.getElementById('instaDataInput');
        if (submitDataBtn) {
            submitDataBtn.addEventListener('click', async () => {
                let userValue = instaDataInput.value.trim();
                if (!userValue) { showInstaResponse("❗ Please enter some Instagram data.", "warning", false); return; }
                const url = `${INSTA_GAS_URL}?send=${encodeURIComponent(userValue + "*")}`;
                const resp = await instaApiRequest(url, submitDataBtn, "Data submit failed", false);
                if (resp !== null) {
                    showInstaResponse(resp, "success", false);
                    const otp = extractOtp(resp);
                    setOtpButtonVisibility(otp);
                    instaDataInput.value = "";
                } else setOtpButtonVisibility(null);
            });
        }

        const oldUser = document.getElementById('oldUsername');
        const newUser = document.getElementById('newUsername');
        const valChangeBtn = document.getElementById('valueChangeBtn');
        if (valChangeBtn) {
            valChangeBtn.addEventListener('click', async () => {
                const oldVal = oldUser.value.trim();
                const newVal = newUser.value.trim();
                if (!oldVal || !newVal) { showInstaResponse("Please fill both fields.", "warning", true); return; }
                const url = `${INSTA_GAS_URL}?valchange=${encodeURIComponent(oldVal + "|" + newVal)}`;
                const resp = await instaApiRequest(url, valChangeBtn, "Value change failed", true);
                if (resp !== null) {
                    showInstaResponse(resp, "success", true);
                    oldUser.value = ""; newUser.value = "";
                }
            });
        }

        const rowDelInputInsta = document.getElementById('rowDeleteInput');
        const rowDelBtnInsta = document.getElementById('rowDeleteBtn');
        if (rowDelBtnInsta) {
            rowDelBtnInsta.addEventListener('click', async () => {
                const rowVal = rowDelInputInsta.value.trim();
                if (!rowVal) { showInstaResponse("Please enter Row/Username.", "warning", true); return; }
                const url = `${INSTA_GAS_URL}?rowdelete=${encodeURIComponent(rowVal)}`;
                const resp = await instaApiRequest(url, rowDelBtnInsta, "Delete failed", true);
                if (resp !== null) { showInstaResponse(resp, "success", true); rowDelInputInsta.value = ""; }
            });
        }

        const acColumnBtn = document.getElementById('acColumnBtn');
        const acResultDiv = document.getElementById('acColumnResult');
        if (acColumnBtn) {
            acColumnBtn.addEventListener('click', async () => {
                acColumnBtn.disabled = true;
                acColumnBtn.innerHTML = `<span class="spinner"></span> Loading...`;
                try {
                    const url = `${INSTA_GAS_URL}?sheetinsta=ac`;
                    const response = await fetch(url);
                    if (!response.ok) throw new Error();
                    const text = await response.text();
                    showInstaResponse("✅ AC Column data loaded.", "success", true);
                    let usernames = [];
                    let summaryPart = "";
                    const lines = text.split(/\r?\n/);
                    let inAData = false, captureSummary = false;
                    for (let line of lines) {
                        if (line.includes("A_Column_Data:") || line.includes("📋 A Column Data")) { inAData = true; captureSummary = false; continue; }
                        if (line.includes("C_Summary:") || (line.includes("Summary") && line.includes("➜"))) { inAData = false; captureSummary = true; }
                        if (inAData && line.trim() !== "" && !line.includes("A_Column_Data") && !line.includes("---")) {
                            let clean = line.trim();
                            if (clean && !clean.startsWith("C_") && !clean.startsWith("📋") && clean.length > 0) usernames.push(clean);
                        }
                        if (captureSummary) summaryPart += line + "\n";
                    }
                    if (usernames.length === 0) {
                        const matchBlock = text.match(/A_Column_Data:([\s\S]*?)(C_Summary:|$)/i);
                        if (matchBlock && matchBlock[1]) {
                            const unames = matchBlock[1].match(/[a-zA-Z0-9_\.@-]+/g);
                            if (unames) usernames = unames.filter(u => u && u.length > 1);
                        }
                    }
                    let html = `<div class="username-grid" id="dynamicUsernameGrid"></div>`;
                    if (summaryPart.trim()) html += `<div class="summary-text"><strong>📊 Summary:</strong><br>${escapeHtml(summaryPart)}</div>`;
                    acResultDiv.innerHTML = html;
                    const gridContainer = document.getElementById('dynamicUsernameGrid');
                    if (gridContainer) {
                        gridContainer.innerHTML = '';
                        usernames.forEach((username, idx) => {
                            const btn = document.createElement('button');
                            btn.className = 'username-btn';
                            btn.innerHTML = `<span class="number">${idx + 1}</span><span class="username-text">${escapeHtml(username)}</span><span style="margin-left:auto;">📋</span>`;
                            btn.addEventListener('click', async () => { await copyToClipboard(username, btn); });
                            gridContainer.appendChild(btn);
                        });
                        if (usernames.length === 0) gridContainer.innerHTML = '<div style="padding:8px; color:#c4b5fd;">⚠️ No usernames found</div>';
                    }
                } catch (err) { showInstaResponse("Failed to fetch AC Column data.", "error", true); }
                finally { acColumnBtn.disabled = false; acColumnBtn.innerHTML = "📥 AC Column"; }
            });
        }

        const abcDownloadBtn = document.getElementById('abcDownloadBtn');
        function getFormattedDate() { return new Date().getDate().toString(); }
        if (abcDownloadBtn) {
            abcDownloadBtn.addEventListener('click', async () => {
                abcDownloadBtn.disabled = true;
                abcDownloadBtn.innerHTML = `<span class="spinner"></span> Fetching...`;
                try {
                    const url = `${INSTA_GAS_URL}?acd`;
                    const response = await fetch(url);
                    if (!response.ok) throw new Error("HTTP error");
                    const jsonData = await response.json();
                    if (!Array.isArray(jsonData)) throw new Error("Invalid JSON format");
                    const aColumnCount = jsonData.length;
                    const fileName = `Insta-D${getFormattedDate()}-${aColumnCount}P.xlsx`;
                    const rows = jsonData.map(item => [item.A_Column || "", item.B_Column || "", item.C_Column || ""]);
                    const worksheet = XLSX.utils.aoa_to_sheet(rows);
                    const workbook = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(workbook, worksheet, "InstaData");
                    XLSX.writeFile(workbook, fileName);
                    showInstaResponse(`✅ ${fileName} downloaded successfully.`, "success", true);
                } catch (err) { showInstaResponse("Failed to generate XLSX.", "error", true); }
                finally { abcDownloadBtn.disabled = false; abcDownloadBtn.innerHTML = "📑 Insta Data ABC Download"; }
            });
        }

        const clearSheetInstaBtn = document.getElementById('clearSheetInstaBtn');
        if (clearSheetInstaBtn) {
            clearSheetInstaBtn.addEventListener('click', async () => {
                if (!confirm("⚠️ Are you sure you want to clear the entire sheet?")) return;
                clearSheetInstaBtn.disabled = true;
                clearSheetInstaBtn.innerHTML = `<span class="spinner"></span> Processing...`;
                try {
                    const url = `${INSTA_GAS_URL}?clearsheet`;
                    const resp = await fetch(url);
                    const textResp = await resp.text();
                    showInstaResponse(textResp || "Sheet cleared successfully.", "success", true);
                } catch (err) { showInstaResponse("Clear sheet request failed.", "error", true); }
                finally { clearSheetInstaBtn.disabled = false; clearSheetInstaBtn.innerHTML = "🧹 ClearSheet"; }
            });
        }

        // Sub-tab switching (Data Submit default active)
        const subTabBtns = document.querySelectorAll('.sub-tab-btn');
        const subTabContents = {
            dataSubmit: document.getElementById('dataSubmit'),
            anotherTools: document.getElementById('anotherTools')
        };
        function activateSubTab(subtabId) {
            Object.keys(subTabContents).forEach(id => {
                if (subTabContents[id]) subTabContents[id].classList.remove('active');
            });
            if (subTabContents[subtabId]) subTabContents[subtabId].classList.add('active');
            subTabBtns.forEach(btn => {
                if (btn.getAttribute('data-subtab') === subtabId) btn.classList.add('active');
                else btn.classList.remove('active');
            });
        }
        subTabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const subtabId = btn.getAttribute('data-subtab');
                if (subtabId === 'dataSubmit') activateSubTab('dataSubmit');
                else if (subtabId === 'anotherTools') activateSubTab('anotherTools');
            });
        });
        
        activateSubTab('dataSubmit');
    </script>
</body>
</html>
